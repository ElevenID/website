# Independent static marketing origin. Its route ownership is generated from
# the same versioned contract used by the edge and browser handoff logic.
server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Commercial terms and plan checkout are withheld from browser delivery.
    location = /pricing { return 404; }
    location ^~ /pricing/ { return 404; }

    include /etc/nginx/marty-website-routes.conf;
    include /etc/nginx/marty-website-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Page fallbacks internally redirect here; the document is not a public route.
    location = /index.html {
        internal;
        try_files $uri =404;
        expires -1;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /_website/runtime-config.js {
        try_files $uri =404;
        include /etc/nginx/marty-website-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /_website/ {
        try_files $uri =404;
        include /etc/nginx/marty-website-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Known resources cannot become HTML fallbacks or expose unowned root files.
    # Exact crawler/feed routes and the versioned resource prefix take precedence.
    # Other dotted article/author slugs and numeric demo releases remain pages.
    location ~* \.(?:css|[cm]?js|json|txt|xml|map|png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|eot|mp[34]|webm|pdf|zip|wasm)$ {
        return 404;
    }
    location / {
        return 404;
    }
}
