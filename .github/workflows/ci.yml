name: Website CI

on:
  pull_request:
  push:
    branches: [main, feat/complete-website-source-graph]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route-contract:
    name: Website contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pins are copied from the source CI recorded in extraction-provenance.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install pinned test dependencies
        run: |
          node scripts/verify-package-manager.mjs
          bun install --frozen-lockfile --linker=hoisted
      - name: Pull pinned Nginx test image
        run: docker pull nginx@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
      - name: Verify contracts, components and build artifacts
        run: bun run test
      - name: Verify website HTTP routing
        run: bun run test:nginx
      - name: Build standalone website with development identity
        env:
          MARTY_WEBSITE_SOURCE_SHA: development
          MARTY_WEBSITE_ALLOW_DEVELOPMENT: 'true'
          MARTY_PRODUCTION_PAGES: public
        run: |
          bun run build:website
          node scripts/verify-standalone-bundle.mjs
